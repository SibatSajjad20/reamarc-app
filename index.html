<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="/worklane-mark.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/worklane-mark.png" />
  <title>Worklane</title>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('reamarc-theme');
        var p = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : null;
        var dark =
          p === 'dark' ||
          ((p === null || p === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
        if (document.body) {
          document.body.classList.remove('light', 'dark');
          document.body.classList.add(theme);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Neutral first-paint loader (no brand name). Removed when React mounts. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #FAF9FD;
      /* color-scheme set on <html> by theme bootstrap */
    }
    html.dark #boot-splash {
      background: #0A0B10;
    }
    #boot-splash .boot-mark {
      width: 56px;
      height: 56px;
      object-fit: contain;
      display: block;
    }
    #boot-splash .boot-spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(79, 70, 229, 0.22);
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: boot-spin 0.7s linear infinite;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-busy="true" aria-label="Loading">
    <img class="boot-mark" src="/worklane-mark.png" alt="" width="56" height="56" />
    <div class="boot-spinner" role="presentation"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
